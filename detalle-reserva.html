<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Detalle de reserva | Happy Paws</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="assets/css/styles.css">
  <script defer src="assets/js/app.js"></script>
</head>
<body data-page="detalle-reserva">
  <div class="page-shell">
    <header class="sticky top-0 z-40 border-b border-white/70 bg-white/90 backdrop-blur" data-nav></header>
    <main class="main-content">
      <section class="mx-auto max-w-4xl px-4 py-14 sm:px-6 lg:px-8">
        <p class="font-black uppercase tracking-wide text-emerald-700">Reserva</p>
        <h1 class="section-title mt-2">Detalle de tu cita</h1>
        <div id="reservation-detail" class="mt-8"></div>
        <div class="card mt-6 p-6">
          <p class="font-black uppercase tracking-wide text-rose-500">Política de anulación</p>
          <p class="mt-2 text-slate-600">Puedes anular sin costo hasta 12 horas antes del horario reservado. Pasado ese plazo, se evaluará caso a caso.</p>
        </div>
      </section>
    </main>
    <footer class="border-t border-slate-200 bg-white" data-footer></footer>
  </div>
</body>
</html>
