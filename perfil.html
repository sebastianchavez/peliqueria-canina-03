<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mi perfil | Happy Paws</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="assets/css/styles.css">
  <script defer src="assets/js/app.js"></script>
</head>
<body data-page="perfil">
  <div class="page-shell">
    <header class="sticky top-0 z-40 border-b border-white/70 bg-white/90 backdrop-blur" data-nav></header>
    <main class="main-content">
      <section class="mx-auto max-w-7xl px-4 py-14 sm:px-6 lg:px-8">
        <p class="font-black uppercase tracking-wide text-emerald-700">Mi cuenta</p>
        <h1 class="section-title mt-2">Mi perfil</h1>
        <div class="mt-8 grid gap-8 lg:grid-cols-[360px_1fr]">
          <div id="profile-card"></div>
          <div>
            <div class="flex items-end justify-between gap-3">
              <h2 class="text-2xl font-black text-slate-900">Historial de reservas</h2>
              <a class="btn-primary" href="reservar.html">Nueva reserva</a>
            </div>
            <div id="reservation-history" class="mt-5 grid gap-4"></div>
          </div>
        </div>
      </section>
    </main>
    <footer class="border-t border-slate-200 bg-white" data-footer></footer>
  </div>
</body>
</html>
