<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pago de reserva | Happy Paws</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="assets/css/styles.css">
  <script defer src="assets/js/app.js"></script>
</head>
<body data-page="pago">
  <div class="page-shell">
    <header class="sticky top-0 z-40 border-b border-white/70 bg-white/90 backdrop-blur" data-nav></header>
    <main class="main-content">
      <section class="mx-auto grid max-w-6xl gap-8 px-4 py-14 sm:px-6 lg:grid-cols-[1fr_420px] lg:px-8">
        <form id="payment-form" class="card grid gap-5 p-6">
          <div>
            <p class="font-black uppercase tracking-wide text-emerald-700">Pago simulado</p>
            <h1 class="section-title mt-2">Confirma tu reserva</h1>
            <p class="mt-3 text-slate-600">Ingresa los datos de tu tarjeta. Esta pantalla es solo una demostración, no se procesan cobros reales.</p>
          </div>

          <fieldset class="grid gap-3">
            <legend class="label">Método de pago</legend>
            <div class="grid gap-3 sm:grid-cols-3">
              <label class="card flex cursor-pointer items-center gap-3 p-4">
                <input type="radio" name="method" value="credito" checked>
                <span class="font-bold text-slate-700">Crédito</span>
              </label>
              <label class="card flex cursor-pointer items-center gap-3 p-4">
                <input type="radio" name="method" value="debito">
                <span class="font-bold text-slate-700">Débito</span>
              </label>
              <label class="card flex cursor-pointer items-center gap-3 p-4">
                <input type="radio" name="method" value="transfer">
                <span class="font-bold text-slate-700">Transferencia</span>
              </label>
            </div>
          </fieldset>

          <div>
            <label class="label" for="cardNumber">Número de tarjeta</label>
            <input class="input" id="cardNumber" name="cardNumber" inputmode="numeric" placeholder="0000 0000 0000 0000" maxlength="19" required>
          </div>

          <div>
            <label class="label" for="cardName">Nombre del titular</label>
            <input class="input" id="cardName" name="cardName" required placeholder="Como aparece en la tarjeta">
          </div>

          <div class="grid gap-4 sm:grid-cols-3">
            <div>
              <label class="label" for="cardExpiry">Vencimiento</label>
              <input class="input" id="cardExpiry" name="cardExpiry" placeholder="MM/AA" maxlength="5" required>
            </div>
            <div>
              <label class="label" for="cardCvv">CVV</label>
              <input class="input" id="cardCvv" name="cardCvv" inputmode="numeric" placeholder="123" maxlength="4" required>
            </div>
            <div>
              <label class="label" for="cardInstallments">Cuotas</label>
              <select class="select" id="cardInstallments" name="cardInstallments">
                <option>1 cuota</option>
                <option>2 cuotas</option>
                <option>3 cuotas</option>
                <option>6 cuotas</option>
              </select>
            </div>
          </div>

          <button class="btn-coral" type="submit">Pagar y confirmar reserva</button>
          <div id="payment-message" hidden></div>
        </form>

        <aside class="lg:sticky lg:top-28 lg:self-start">
          <div id="payment-summary"></div>
          <div class="card mt-5 p-6">
            <p class="font-black uppercase tracking-wide text-rose-500">Seguridad</p>
            <p class="mt-2 text-slate-600">Esta es una demo sin integración real. En producción conecta con tu pasarela (Transbank, MercadoPago, Stripe, etc.).</p>
          </div>
        </aside>
      </section>
    </main>
    <footer class="border-t border-slate-200 bg-white" data-footer></footer>
  </div>
</body>
</html>
