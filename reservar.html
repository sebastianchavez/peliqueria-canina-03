<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reservar cita | Happy Paws</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="assets/css/styles.css">
  <script defer src="assets/js/app.js"></script>
</head>
<body data-page="reservar">
  <div class="page-shell">
    <header class="sticky top-0 z-40 border-b border-white/70 bg-white/90 backdrop-blur" data-nav></header>
    <main class="main-content">
      <section class="mx-auto grid max-w-7xl gap-8 px-4 py-14 sm:px-6 lg:grid-cols-[1fr_380px] lg:px-8">
        <div>
          <p class="font-black uppercase tracking-wide text-emerald-700">Nueva reserva</p>
          <h1 class="section-title mt-2">Agenda una cita</h1>
          <p class="mt-3 text-slate-600">Completa los datos de tu mascota y nos pondremos en contacto para confirmar disponibilidad.</p>
          <form id="reserve-form" class="card mt-8 grid gap-5 p-6">
            <div class="grid gap-5 sm:grid-cols-2">
              <div>
                <label class="label" for="serviceId">Servicio</label>
                <select class="select" id="serviceId" name="serviceId" required></select>
              </div>
              <div>
                <label class="label" for="petSize">Tamaño</label>
                <select class="select" id="petSize" name="petSize" required>
                  <option>Pequeño</option>
                  <option>Mediano</option>
                  <option>Grande</option>
                  <option>Gigante</option>
                </select>
              </div>
            </div>
            <div>
              <label class="label" for="petName">Nombre de la mascota</label>
              <input class="input" id="petName" name="petName" required placeholder="Ej: Bruno">
            </div>
            <div class="grid gap-5 sm:grid-cols-2">
              <div>
                <label class="label" for="date">Fecha</label>
                <input class="input" id="date" name="date" type="date" required>
              </div>
              <div>
                <label class="label" for="time">Hora</label>
                <input class="input" id="time" name="time" type="time" required min="09:00" max="19:00">
              </div>
            </div>
            <div class="grid gap-5 sm:grid-cols-3">
              <div>
                <label class="label" for="ownerName">Tutor</label>
                <input class="input" id="ownerName" name="ownerName" required placeholder="Nombre completo">
              </div>
              <div>
                <label class="label" for="email">Correo</label>
                <input class="input" id="email" name="email" type="email" required placeholder="correo@ejemplo.cl">
              </div>
              <div>
                <label class="label" for="phone">Teléfono</label>
                <input class="input" id="phone" name="phone" required placeholder="+56 9 1234 5678">
              </div>
            </div>
            <div>
              <label class="label" for="notes">Observaciones</label>
              <textarea class="textarea" id="notes" name="notes" rows="4" placeholder="Alergias, comportamiento, estilo preferido"></textarea>
            </div>
            <label class="flex items-start gap-2 text-sm text-slate-600">
              <input type="checkbox" required class="mt-1">
              <span>Acepto los <a class="font-bold text-emerald-700" href="terminos.html">Términos</a> y la <a class="font-bold text-emerald-700" href="privacidad.html">Política de privacidad</a>.</span>
            </label>
            <button class="btn-primary" type="submit">Confirmar reserva</button>
          </form>
        </div>
        <aside class="lg:sticky lg:top-28 lg:self-start">
          <div id="reserve-summary" class="card p-6"></div>
          <div class="card mt-5 p-6">
            <p class="font-black uppercase tracking-wide text-rose-500">Tip Happy Paws</p>
            <p class="mt-2 text-slate-600">Si tu perro es nervioso o cachorro, llega 10 minutos antes para una adaptación tranquila.</p>
          </div>
        </aside>
      </section>
    </main>
    <footer class="border-t border-slate-200 bg-white" data-footer></footer>
  </div>
</body>
</html>
