<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Galería antes y después | Happy Paws</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="assets/css/styles.css">
  <script defer src="assets/js/app.js"></script>
</head>
<body data-page="galeria">
  <div class="page-shell">
    <header class="sticky top-0 z-40 border-b border-white/70 bg-white/90 backdrop-blur" data-nav></header>
    <main class="main-content">
      <section class="mx-auto max-w-7xl px-4 py-14 sm:px-6 lg:px-8">
        <p class="font-black uppercase tracking-wide text-rose-500">Galería</p>
        <h1 class="section-title mt-2">Antes y después</h1>
        <p class="mt-4 max-w-2xl text-lg text-slate-600">Desliza el divisor en cada imagen para descubrir la transformación real de nuestros clientes peludos.</p>
        <div id="gallery-grid" class="mt-10 grid gap-6 md:grid-cols-2 lg:grid-cols-3"></div>
      </section>

      <section class="soft-band-coral">
        <div class="mx-auto max-w-4xl px-4 py-14 text-center sm:px-6 lg:px-8">
          <p class="font-black uppercase tracking-wide text-rose-500">¿Listo para la tuya?</p>
          <h2 class="section-title mt-2">Reserva una transformación</h2>
          <p class="mt-4 text-lg text-slate-600">Cada visita incluye productos suaves, secado cuidadoso y mucho cariño.</p>
          <a class="btn-coral mt-6" href="reservar.html">Reservar ahora</a>

    <footer class="border-t border-slate-200 bg-white" data-footer></footer>
